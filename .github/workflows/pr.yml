name: PR

on:
  pull_request:
    branches:
      - master

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api30.sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
          cache-dependency-path: api30.sdk/pom.xml

      - name: Run unit tests
        run: mvn test -B

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: api30.sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven
          cache-dependency-path: api30.sdk/pom.xml

      - name: Validate sandbox credentials
        env:
          CIELO_MERCHANT_ID: ${{ secrets.CIELO_MERCHANT_ID }}
          CIELO_MERCHANT_KEY: ${{ secrets.CIELO_MERCHANT_KEY }}
        run: |
          if [ -z "$CIELO_MERCHANT_ID" ] || [ -z "$CIELO_MERCHANT_KEY" ]; then
            echo "::error::Configure os secrets CIELO_MERCHANT_ID e CIELO_MERCHANT_KEY no repositório GitHub."
            exit 1
          fi

      - name: Run integration tests
        env:
          CIELO_MERCHANT_ID: ${{ secrets.CIELO_MERCHANT_ID }}
          CIELO_MERCHANT_KEY: ${{ secrets.CIELO_MERCHANT_KEY }}
        run: mvn verify -DskipITs=false -B
